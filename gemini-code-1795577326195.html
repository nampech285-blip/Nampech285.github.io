<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตะลุยด่าน A-Level ภาษาจีน (A-Level Chinese Quest)</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff5e7e;
            --secondary: #6c5ce7;
            --accent: #fdcb6e;
            --bg-grad: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --success: #00b894;
            --danger: #d63031;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', 'Noto Sans SC', sans-serif;
        }

        body {
            background: var(--bg-grad);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #2d3436;
        }

        .game-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
            border: 4px solid #fff;
        }

        /* Header Status Bar */
        .status-bar {
            background: #2d3436;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.1rem;
        }

        .hearts {
            color: #ff7675;
            font-size: 1.4rem;
            letter-spacing: 3px;
        }

        .stage-badge {
            background: var(--secondary);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .score-box {
            color: var(--accent);
            font-weight: 700;
        }

        /* Battle Arena */
        .arena {
            background: linear-gradient(to bottom, #dfe6e9, #b2bec3);
            padding: 25px 20px;
            text-align: center;
            position: relative;
            border-bottom: 4px dashed #636e72;
        }

        .monster-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #2d3436;
            background: rgba(255,255,255,0.8);
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .characters {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 4rem;
            margin: 10px 0;
        }

        .hero, .monster {
            transition: transform 0.3s ease;
            user-select: none;
        }

        .attack-hero {
            transform: translateX(80px) scale(1.2);
        }

        .hit-monster {
            animation: shake 0.4s;
            filter: brightness(2) saturate(0);
        }

        .hit-hero {
            animation: shake 0.4s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            50% { transform: translateX(10px); }
            75% { transform: translateX(-10px); }
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #dfe6e9;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff5e7e, #fdcb6e);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Question Area */
        .quiz-area {
            padding: 25px;
        }

        .question-text {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.55rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            line-height: 1.6;
            color: #1e272e;
            background: #f1f2f6;
            padding: 20px;
            border-radius: 16px;
            border-left: 6px solid var(--secondary);
        }

        .blank-highlight {
            color: var(--primary);
            text-decoration: underline;
            padding: 0 5px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option-btn {
            background: white;
            border: 2px solid #dfe6e9;
            border-radius: 14px;
            padding: 15px;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #dfe6e9;
            color: #2d3436;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #f8f7ff;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--secondary);
        }

        .option-btn:active:not(:disabled) {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--secondary);
        }

        .option-btn.correct {
            background: var(--success);
            color: white;
            border-color: #009475;
            box-shadow: 0 4px 0 #009475;
        }

        .option-btn.wrong {
            background: var(--danger);
            color: white;
            border-color: #b32425;
            box-shadow: 0 4px 0 #b32425;
        }

        /* Feedback Modal/Box */
        .feedback-box {
            margin-top: 20px;
            padding: 18px;
            border-radius: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-box.win {
            background: #e3fcef;
            border: 2px solid var(--success);
            color: #006644;
        }

        .feedback-box.lose {
            background: #ffeae9;
            border: 2px solid var(--danger);
            color: #991b1b;
        }

        .feedback-title {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 6px;
        }

        .feedback-detail {
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .next-btn {
            margin-top: 15px;
            width: 100%;
            padding: 14px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background: #5649c0;
        }

        /* Start & End Screens */
        .screen {
            padding: 40px 25px;
            text-align: center;
        }

        .screen h1 {
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .screen p {
            color: #636e72;
            margin-bottom: 25px;
            font-size: 1.05rem;
            line-height: 1.6;
        }

        .big-icon {
            font-size: 5rem;
            margin-bottom: 15px;
            display: block;
        }

        .start-btn {
            background: linear-gradient(45deg, #ff5e7e, #ff9966);
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 94, 126, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
            .question-text {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Start Screen -->
    <div id="start-screen" class="screen">
        <span class="big-icon">🐉⚔️📚</span>
        <h1>ตะลุยด่าน A-Level จีน</h1>
        <p>สวมบทบาทจอมยุทธ์ภาษาจีน ปราบมอนสเตอร์คำศัพท์ทั้ง 9 ด่าน!<br>มีหัวใจทั้งหมด 3 ดวง ตอบให้ถูกเพื่อโจมตีและพิชิตข้อสอบ</p>
        <button class="start-btn" onclick="startGame()">เริ่มผจญภัยเลย!</button>
    </div>

    <!-- Gameplay Screen -->
    <div id="play-screen" class="hidden">
        <div class="status-bar">
            <div class="hearts" id="hearts-display">❤️❤️❤️</div>
            <div class="stage-badge" id="stage-display">ด่านที่ 1 / 9</div>
            <div class="score-box">⭐ <span id="score-display">0</span></div>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>

        <div class="arena">
            <div class="monster-name" id="monster-name">ด่าน 1: สไลม์จอมสาย</div>
            <div class="characters">
                <div class="hero" id="hero-char">🧑‍🎓</div>
                <div style="font-size: 1.5rem; color: #636e72; font-weight: bold;">VS</div>
                <div class="monster" id="monster-char">👾</div>
            </div>
        </div>

        <div class="quiz-area">
            <div class="question-text" id="question-box">
                <!-- Question injected here -->
            </div>

            <div class="options-grid" id="options-box">
                <!-- Options injected here -->
            </div>

            <div class="feedback-box" id="feedback-box">
                <div class="feedback-title" id="feedback-title"></div>
                <div class="feedback-detail" id="feedback-detail"></div>
                <button class="next-btn" id="next-btn" onclick="nextStage()">ลุยด่านต่อไป ➡️</button>
            </div>
        </div>
    </div>

    <!-- End Screen -->
    <div id="end-screen" class="screen hidden">
        <span class="big-icon" id="end-icon">🏆</span>
        <h1 id="end-title">ยินดีด้วย! พิชิตครบทุกด่านแล้ว</h1>
        <p id="end-summary"></p>
        <button class="start-btn" onclick="startGame()">เล่นใหม่อีกครั้ง 🔄</button>
    </div>
</div>

<script>
    // คลังข้อสอบทั้ง 9 ด่าน
    const stages = [
        {
            monsterName: "ด่าน 1: สไลม์จอมสาย",
            monsterIcon: "🟢",
            question: "他每天都能_______到学校，从不迟到。",
            options: ["按时", "时刻", "临时", "平时"],
            answer: "按时",
            pinyin: "ànshí",
            meaning: "ตรงเวลา / ตามเวลาที่กำหนด",
            translation: "เขาสามารถมาถึงโรงเรียนได้ตรงเวลาทุกวัน ไม่เคยมาสายเลย"
        },
        {
            monsterName: "ด่าน 2: ภูตพฤกษาทึบ",
            monsterIcon: "🌲",
            question: "这片森林的树长得_______。",
            options: ["浓", "密", "淡", "深"],
            answer: "密",
            pinyin: "mì",
            meaning: "หนาแน่น / ทึบ",
            translation: "ต้นไม้ในป่าผืนนี้ขึ้นอย่างหนาแน่น"
        },
        {
            monsterName: "ด่าน 3: ปีศาจกระดาษพับ",
            monsterIcon: " Origami 🦅",
            question: "他把那张纸_______成了一个纸飞机。",
            options: ["摆", "折", "擦", "抄"],
            answer: "折",
            pinyin: "zhé",
            meaning: "พับ",
            translation: "เขาพับกระดาษแผ่นนั้นให้กลายเป็นเครื่องบินกระดาษ"
        },
        {
            monsterName: "ด่าน 4: อัศวินท่านประธาน",
            monsterIcon: "💼",
            question: "他在公司_______总经理。",
            options: ["安排", "管理", "负责", "担任"],
            answer: "担任",
            pinyin: "dānrèn",
            meaning: "ดำรงตำแหน่ง / รับหน้าที่",
            translation: "เขาดำรงตำแหน่งผู้จัดการทั่วไปอยู่ในบริษัท"
        },
        {
            monsterName: "ด่าน 5: พายุสายฟ้าแลบ",
            monsterIcon: "⚡",
            question: "他一听到这个好消息，_______打电话告诉了父母。",
            options: ["马上", "总是", "快要", "终于"],
            answer: "马上",
            pinyin: "mǎshàng",
            meaning: "ทันที / ทันใดนั้น",
            translation: "พอเขาได้ยินข่าวดีนี้ ก็รีบโทรศัพท์ไปบอกพ่อแม่ทันที"
        },
        {
            monsterName: "ด่าน 6: เขาวงกตปริศนา",
            monsterIcon: "🌀",
            question: "这个问题不_______，需要仔细分析。",
            options: ["严重", "重要", "简单", "随便"],
            answer: "简单",
            pinyin: "jiǎndān",
            meaning: "ง่าย / ไม่ซับซ้อน",
            translation: "ปัญหานี้ไม่ง่ายเลย จำเป็นต้องวิเคราะห์อย่างละเอียดรอบคอบ"
        },
        {
            monsterName: "ด่าน 7: ตัวตลกแห่งเสียงหัวเราะ",
            monsterIcon: "🤡",
            question: "小王是一个很_______的人，他总能让别人笑起来。",
            options: ["幽默", "善良", "勇敢", "自私"],
            answer: "幽默",
            pinyin: "yōumò",
            meaning: "มีอารมณ์ขัน",
            translation: "เสี่ยวหวังเป็นคนที่มีอารมณ์ขันมาก เขามักจะทำให้คนอื่นหัวเราะได้เสมอ"
        },
        {
            monsterName: "ด่าน 8: โกเลมศิลาฐานราก",
            monsterIcon: "🗿",
            question: "拼音是学习中文的_______，一定要重视。",
            options: ["初级", "基础", "基本", "水平"],
            answer: "基础",
            pinyin: "jīchǔ",
            meaning: "พื้นฐาน / รากฐาน",
            translation: "พินอินเป็นพื้นฐานของการเรียนภาษาจีน ต้องให้ความสำคัญอย่างยิ่ง"
        },
        {
            monsterName: "ด่าน 9 (บอสใหญ่): มังกรแห่งความร่าเริง",
            monsterIcon: "🐉",
            question: "小朋友们在公园里玩得_______。",
            options: ["一帆风顺", "胡说八道", "莫名其妙", "兴高采烈"],
            answer: "兴高采烈",
            pinyin: "xìnggāo cǎiliè",
            meaning: "เบิกบานใจ / ร่าเริงคึกคัก / ตื่นเต้นยินดี",
            translation: "เด็กๆ เล่นกันอยู่ในสวนสาธารณะอย่างร่าเริงเบิกบานใจ"
        }
    ];

    let currentStage = 0;
    let hearts = 3;
    let score = 0;
    let combo = 0;
    let answered = false;

    // ระบบเสียงเอฟเฟกต์ง่ายๆ ด้วย Web Audio API
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }
    }

    function startGame() {
        currentStage = 0;
        hearts = 3;
        score = 0;
        combo = 0;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('play-screen').classList.remove('hidden');
        loadStage();
    }

    function updateStatus() {
        document.getElementById('hearts-display').innerText = '❤️'.repeat(hearts) + '🖤'.repeat(3 - hearts);
        document.getElementById('stage-display').innerText = `ด่านที่ ${currentStage + 1} / ${stages.length}`;
        document.getElementById('score-display').innerText = score;
        const progressPercent = (currentStage / stages.length) * 100;
        document.getElementById('progress-fill').style.width = `${progressPercent}%`;
    }

    function loadStage() {
        answered = false;
        updateStatus();
        const data = stages[currentStage];

        // อัปเดตมอนสเตอร์
        document.getElementById('monster-name').innerText = data.monsterName;
        const monsterEl = document.getElementById('monster-char');
        monsterEl.innerText = data.monsterIcon;
        monsterEl.style.opacity = '1';
        monsterEl.style.transform = 'scale(1)';

        // แสดงโจทย์ (เน้นช่องว่าง)
        const formattedQ = data.question.replace('_______', '<span class="blank-highlight">_______</span>');
        document.getElementById('question-box').innerHTML = formattedQ;

        // สร้างตัวเลือก
        const optionsBox = document.getElementById('options-box');
        optionsBox.innerHTML = '';
        data.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(opt, btn);
            optionsBox.appendChild(btn);
        });

        // ซ่อนกล่องเฉลย
        document.getElementById('feedback-box').style.display = 'none';
    }

    function checkAnswer(selected, btnElement) {
        if (answered) return;
        answered = true;

        const data = stages[currentStage];
        const buttons = document.querySelectorAll('.option-btn');
        buttons.forEach(b => b.disabled = true);

        const feedbackBox = document.getElementById('feedback-box');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackDetail = document.getElementById('feedback-detail');
        const nextBtn = document.getElementById('next-btn');

        // แทนที่คำตอบลงในประโยคโจทย์
        const completedSentence = data.question.replace('_______', `<span style="color:#00b894;">${data.answer}</span>`);
        document.getElementById('question-box').innerHTML = completedSentence;

        if (selected === data.answer) {
            playSound('correct');
            btnElement.classList.add('correct');
            combo++;
            const bonus = combo > 1 ? combo * 20 : 0;
            score += (100 + bonus);

            // อนิเมชันโจมตีมอนสเตอร์
            const hero = document.getElementById('hero-char');
            const monster = document.getElementById('monster-char');
            hero.classList.add('attack-hero');
            setTimeout(() => {
                monster.classList.add('hit-monster');
                monster.style.opacity = '0.3';
            }, 150);
            setTimeout(() => {
                hero.classList.remove('attack-hero');
                monster.classList.remove('hit-monster');
            }, 600);

            feedbackBox.className = 'feedback-box win';
            feedbackTitle.innerText = `⚔️ ยอดเยี่ยม! โจมตีสำเร็จ! ${combo > 1 ? `(Combo x${combo} +${bonus} คะแนน!)` : ''}`;
        } else {
            playSound('wrong');
            btnElement.classList.add('wrong');
            // ไฮไลต์ข้อที่ถูก
            buttons.forEach(b => {
                if (b.innerText === data.answer) b.classList.add('correct');
            });

            combo = 0;
            hearts--;
            document.getElementById('hero-char').classList.add('hit-hero');
            setTimeout(() => document.getElementById('hero-char').classList.remove('hit-hero'), 500);

            feedbackBox.className = 'feedback-box lose';
            feedbackTitle.innerText = `💥 พลาดท่า! โดนโจมตีเสียหัวใจ 1 ดวง`;
        }

        updateStatus();

        feedbackDetail.innerHTML = `
            <strong>คำตอบที่ถูกต้อง:</strong> ${data.answer} (${data.pinyin}) — <em>${data.meaning}</em><br>
            <strong>คำแปลประโยค:</strong> "${data.translation}"
        `;

        if (hearts <= 0) {
            nextBtn.innerText = "ดูสรุปผลการผจญภัย 💔";
        } else if (currentStage === stages.length - 1) {
            nextBtn.innerText = "รับถ้วยรางวัลแห่งชัยชนะ 🏆";
        } else {
            nextBtn.innerText = "ลุยด่านต่อไป ➡️";
        }

        feedbackBox.style.display = 'block';
    }

    function nextStage() {
        if (hearts <= 0) {
            showEndScreen(false);
            return;
        }
        currentStage++;
        if (currentStage >= stages.length) {
            document.getElementById('progress-fill').style.width = '100%';
            showEndScreen(true);
        } else {
            loadStage();
        }
    }

    function showEndScreen(isWin) {
        document.getElementById('play-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');

        const endIcon = document.getElementById('end-icon');
        const endTitle = document.getElementById('end-title');
        const endSummary = document.getElementById('end-summary');

        if (isWin) {
            endIcon.innerText = "🏆🎉";
            endTitle.innerText = "พิชิตด่าน A-Level จีนสำเร็จ!";
            endTitle.style.color = "#00b894";
            endSummary.innerHTML = `สุดยอดมาก! คุณปราบบอสครบทั้ง 9 ด่าน<br>คะแนนรวมของคุณคือ <strong>${score} คะแนน</strong> (เหลือหัวใจ ${hearts} ดวง)`;
        } else {
            endIcon.innerText = "💀🥀";
            endTitle.innerText = "พลังชีวิตหมดลงแล้ว!";
            endTitle.style.color = "#d63031";
            endSummary.innerHTML = `คุณมาได้ถึง <strong>ด่านที่ ${currentStage + 1}</strong> และทำได้ <strong>${score} คะแนน</strong><br>ทบทวนคำศัพท์แล้วกลับมาแก้มือใหม่นะ!`;
        }
    }
</script>
